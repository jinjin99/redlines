<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orders</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #222; background: #f5f5f5; }
  .page { max-width: 960px; margin: 0 auto; padding: 24px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 22px; }
  /* A shorthand with var(): the browser can't read its longhands back (padding-bottom comes out empty). */
  .page { --pad: 16px; --pad-end: 24px; }
  .card { background: #fff; border-radius: 8px; padding: var(--pad) var(--pad) var(--pad-end); margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
  .badge { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; background: #e3e3e3; }
  .badge-paid { background: #b7e4b7; font-weight: 600; }
  .button { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  .button-primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .dialog { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; }
  .dialog.open { display: flex; }
  .dialog-panel { background: #fff; border-radius: 8px; padding: 20px; width: 360px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1>Orders</h1>
    <div class="actions"><button class="button" id="export">Export</button><button class="button button-primary">New order</button></div>
  </header>
  <div class="card">
    <span class="sr-only">Order list</span>
    <table>
      <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th><th>Refund</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="dialog" id="details" role="dialog" aria-label="Order details">
    <div class="dialog-panel">
      <h2>Order details</h2>
      <p>Shipped with express delivery.</p>
      <button class="button" id="close">Close</button>
    </div>
  </div>
</div>
<script>
fetch('/api/orders').then(r => r.json()).then(orders => {
  document.getElementById('rows').innerHTML = orders.map(o =>
    '<tr><td><a href="#" class="order-link">' + o.id + '</a></td><td>' + o.customer + '</td>' +
    '<td><span class="badge' + (o.status === 'Paid' ? ' badge-paid' : '') + '">' + o.status + '</span></td><td>' + o.total + '</td><td><button class="button">Refund</button></td></tr>').join('');
  document.querySelectorAll('.order-link').forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById('details').classList.add('open'); });
});
document.getElementById('close').onclick = () => document.getElementById('details').classList.remove('open');
</script>
</body>
</html>
